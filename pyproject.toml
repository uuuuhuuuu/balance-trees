[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimental-balance-trees"
version = "0.1.0"
description = "Reproducible experiments with metadata-free randomized BST rotations"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
balance-tree-experiment = "balance_trees.experiment:main"
balance-tree-demo = "balance_trees.demo:main"
balance-tree-showcase = "balance_trees.showcase.server:main"
balance-tree-benchmark = "balance_trees.benchmark:main"
balance-tree-benchmark-report = "balance_trees.benchmark_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"balance_trees.showcase" = ["site/dist/*", "site/dist/results/*", "site/dist/random-level-results/*", "site/dist/random-level-v2-results/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]
