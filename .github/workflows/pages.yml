name: Publish Rotation Lab

on:
  push:
    paths:
      - ".github/workflows/pages.yml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and prepare website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test Python implementations
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check website JavaScript
        run: |
          node --check src/balance_trees/showcase/site/dist/app.mjs
          node --check src/balance_trees/showcase/site/dist/model.mjs
          node --check src/balance_trees/showcase/site/dist/player.mjs
          node --check src/balance_trees/showcase/site/dist/runtime.mjs
          node --check src/balance_trees/showcase/site/dist/priority-free.mjs
          node --check src/balance_trees/showcase/site/dist/timeline.mjs
          node --check src/balance_trees/showcase/site/dist/interface.mjs
          node --check src/balance_trees/showcase/site/dist/large-model.mjs
          node --check src/balance_trees/showcase/site/dist/large-worker.mjs
          node --check src/balance_trees/showcase/site/dist/stream-player.mjs
      - name: Test browser models and playback
        run: |
          node tests/test_showcase_browser.mjs
          node tests/test_large_showcase.mjs
      - name: Prepare browser-only website
        env:
          PYTHONPATH: src
        run: python -m balance_trees.showcase.build --output _site
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
